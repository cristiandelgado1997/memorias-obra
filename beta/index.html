@font-face{font-family:'IBM Plex Sans Condensed';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-condensed-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans Condensed';font-weight:500;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-condensed-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans Condensed';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-condensed-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Sans Condensed';font-weight:700;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-sans-condensed-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:400;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'IBM Plex Mono';font-weight:600;font-style:normal;font-display:swap;src:url(fonts/ibm-plex-mono-latin-600-normal.woff2) format('woff2')}
/* Layout: herramienta de campo a una columna; lista de ítems → ficha del ítem → hoja de medida; barra de pestañas abajo */
:root{
  --bg:#eef0f2; --panel:#ffffff; --ink:#15202b; --muted:#5b6774; --line:#d3d8de;
  --accent:#1d6fd8; --accent-ink:#ffffff; --accent-soft:#e3eefc; --amber:#ffb020; --head:#10161d; --head-2:#1a232d; --head-ink:#f3f6f9; --head-mut:#9fb0c2; --hatch:#f1f4f7;
  --warn:#a35d00; --warn-soft:#fbecd5; --bad:#b3261e; --bad-soft:#f8dedb; --ok:#1d7a46; --ok-soft:#dbf0e3;
  --f-ui:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --panel:#18212a; --ink:#e7ecf1; --muted:#9aa7b4; --line:#2b3743;
  --accent:#5aa2ff; --accent-ink:#06121f; --accent-soft:#1a2f47; --amber:#ffb020; --head:#0a0f14; --head-2:#151d25; --head-ink:#f3f6f9; --head-mut:#9fb0c2; --hatch:#1d2731;
  --warn:#f0b35a; --warn-soft:#3a2a12; --bad:#f08a82; --bad-soft:#3d1c1a; --ok:#6fd39a; --ok-soft:#163526; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --panel:#18212a; --ink:#e7ecf1; --muted:#9aa7b4; --line:#2b3743;
  --accent:#5aa2ff; --accent-ink:#06121f; --accent-soft:#1a2f47; --amber:#ffb020; --head:#0a0f14; --head-2:#151d25; --head-ink:#f3f6f9; --head-mut:#9fb0c2; --hatch:#1d2731;
  --warn:#f0b35a; --warn-soft:#3a2a12; --bad:#f08a82; --bad-soft:#3d1c1a; --ok:#6fd39a; --ok-soft:#163526; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.35}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);padding-block:12px}
header.top .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
header.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .sub{font-size:11px;color:var(--head-mut);letter-spacing:.12em;text-transform:uppercase;letter-spacing:.06em}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;border:0;background:var(--ok-soft);color:var(--ok)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.off{background:var(--bad-soft);color:var(--bad)}
main{padding-block:12px 110px;max-width:760px;margin:0 auto}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--accent)}
.search{width:100%;padding:12px 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);font-size:16px}
.cap{margin:18px 0 6px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;gap:8px}
.cap.l1{color:var(--ink);font-size:13px;margin-top:22px}
.list{display:flex;flex-direction:column;gap:8px}
.it{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;display:grid;grid-template-columns:62px 1fr;gap:4px 10px;text-align:left;width:100%;cursor:pointer}
.it:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.it .cod{font-family:var(--f-num);font-weight:600;font-size:14px}
.it .und{font-size:12px;color:var(--muted);font-weight:600}
.it .d{font-size:13px;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-width:0}
.it .bar{grid-column:2;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.track{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--accent)}
.track i.over{background:var(--warn)}
.empty{padding:28px 16px;text-align:center;color:var(--muted);background:var(--panel);border:1px dashed var(--line);border-radius:var(--r)}
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
.sheet .bar{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding-block:8px}
.sheet .bar h2{font-size:17px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{background:none;border:0;padding:8px;border-radius:8px;cursor:pointer;display:inline-flex;color:var(--ink)}
.iconbtn svg{width:24px;height:24px}
.content{max-width:760px;margin:0 auto;padding-block:14px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.desc{font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-num);font-size:18px;font-weight:600}
.stat span{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.grp{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.grp:first-child{border-top:0}
.med{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;cursor:pointer;text-align:left;width:100%}
.med .t{font-weight:600;font-size:15px;min-width:0}
.med .v{font-family:var(--f-num);font-weight:600;text-align:right}
.med .v.neg{color:var(--bad)}
.med .m{font-size:12px;color:var(--muted);grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 10px}
.med .thumbs{grid-column:1/-1;display:flex;gap:6px}
.med .thumbs img{width:48px;height:48px;object-fit:cover;border-radius:6px}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--warn-soft);color:var(--warn)}
.tag.desc{background:var(--bad-soft);color:var(--bad)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:45;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:14px 24px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.22);display:flex;align-items:center;gap:8px;cursor:pointer}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
label.f input,label.f select,label.f textarea{padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:17px;font-weight:500;color:var(--ink);width:100%;min-width:0}
label.f input.n{font-family:var(--f-num);text-align:right}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.result{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:14px;border-radius:var(--r);background:var(--accent-soft)}
.result b{font-family:var(--f-num);font-size:28px;font-weight:600;color:var(--ink)}
.result span{font-size:13px;font-weight:600;color:var(--muted)}
.result.neg b{color:var(--bad)}
.toggle{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);cursor:pointer;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--panel);padding:12px 16px;border-radius:8px;font-weight:700;cursor:pointer;font-size:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .ph{position:relative}
.photos img{width:84px;height:84px;object-fit:cover;border-radius:8px;display:block}
.photos .x{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:0;background:var(--bad);color:#fff;font-weight:700;cursor:pointer}
.addph{width:84px;height:84px;border-radius:8px;border:1.5px dashed var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;gap:2px}
.addph svg{width:26px;height:26px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{padding:12px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hint{font-size:13px;color:var(--muted)}
.note{font-size:13px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--warn)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table td,.table th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.table th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.table input{width:110px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-family:var(--f-num);text-align:right}
.scroll{overflow-x:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:none;color:var(--bad);font-weight:700;cursor:pointer;padding:0 2px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.viewer{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:16px}
.viewer img{max-height:90%;border-radius:6px}
.update{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));z-index:80;background:var(--panel);border:1px solid var(--accent);border-radius:var(--r);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.18)}
header.top .pill{background:#173a2a;color:#7fe0a8}
header.top .pill.wait{background:#3a2a12;color:#ffc15a}
header.top .pill.off{background:#3d1c1a;color:#ff9b93}
.sheet .bar.dark{background:var(--head);color:var(--head-ink);border-bottom:0}
.sheet .bar.dark .iconbtn{color:var(--head-ink)}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sheet .bar.dark .eyebrow{color:var(--head-mut)}
.chip.dark{background:var(--head-2);color:#c9d4df;border:0;font-weight:600;white-space:nowrap}
.plano-head{display:flex;justify-content:space-between;align-items:flex-end}
.plano-head b{font-size:19px}
.kpi{font-size:15px;font-weight:600;color:var(--accent)}
.plano-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px;height:min(60vh,560px);touch-action:manipulation}
.plano-wrap.tall{height:min(70vh,640px)}
.plano-wrap.mini{height:220px;cursor:pointer}
svg.plano{width:100%;height:100%;display:block}
.ln-w{stroke:var(--ink);stroke-width:.07;pointer-events:none}
.ln-v{stroke:#d04a3a;stroke-width:.035;pointer-events:none}
.ln-m{stroke:var(--muted);stroke-width:.018;opacity:.45;pointer-events:none}
rect.esp{fill:transparent;stroke:transparent;cursor:pointer;pointer-events:all}
rect.esp.medido{fill:rgba(29,111,216,.26);stroke:#1d6fd8;stroke-width:.09}
rect.esp.revisar{fill:rgba(240,140,0,.34);stroke:#c26a00;stroke-width:.09}
rect.esp.vacio{fill:rgba(138,150,163,.10);stroke:#8a96a3;stroke-width:.05}
rect.esp.sel{stroke:var(--amber);stroke-width:.32}
rect.elem{fill:#e9dcc8;stroke:#8a5a2b;stroke-width:.04;pointer-events:none}
svg text{font-family:var(--f-ui)}
text.lbl{text-anchor:middle;dominant-baseline:middle;font-weight:700;fill:var(--ink);pointer-events:none}
text.cota{text-anchor:middle;dominant-baseline:middle;font-family:var(--f-num);font-weight:600}
text.badge{text-anchor:middle;dominant-baseline:central;font-weight:700}
text.area{text-anchor:middle;dominant-baseline:middle;font-family:var(--f-num);font-weight:600;fill:var(--ink)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.leyenda span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;display:inline-block;border:1.5px solid}
.sw.medido{background:rgba(29,111,216,.26);border-color:#1d6fd8}
.sw.revisar{background:rgba(240,140,0,.34);border-color:#c26a00}
.sw.vacio{background:rgba(138,150,163,.10);border-color:#8a96a3}
.ficha{background:var(--head);color:var(--head-ink);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.ficha .stat span{color:var(--head-mut)}
.ficha .stat b{font-size:15px}
.card.fig svg{width:100%;height:auto;display:block;max-height:340px}
.muros{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:420px){.muros{grid-template-columns:1fr}}
.mtit{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:4px}
.badge-m{background:var(--accent);color:#fff;border-radius:999px;padding:2px 8px;font-weight:700;font-size:12px}
.espsel{display:flex;flex-direction:column;gap:8px}
.plano-btn{display:flex;align-items:center;justify-content:center;gap:8px;border-style:dashed;border-color:var(--accent);color:var(--accent)}
.esp-chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink)}
.esp-chip span{flex:1;min-width:0;display:flex;flex-direction:column;font-weight:700}
.esp-chip small{font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.esp-chip .btn{padding:8px 12px}
.partes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.card.fig.pick svg{max-height:260px}
line.hit{stroke:transparent;cursor:pointer;pointer-events:stroke}
.muros-op{display:flex;flex-direction:column;gap:6px}
.muro-op{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.muro-op[aria-pressed="true"]{border-color:var(--head);box-shadow:0 0 0 2px var(--amber)}
.muro-op .mu-t{min-width:0}
.partes button{padding:10px 4px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-weight:700;font-size:14px;cursor:pointer;color:var(--ink)}
.partes button[aria-pressed="true"]{background:var(--head);color:var(--amber);border-color:var(--head)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;font-size:14px;max-width:90%}
details summary{cursor:pointer;font-weight:600;font-size:14px}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}}
</style>

  <div class="row">

</header>

  <button type="button" data-tab="plano"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="1"/><path d="M3 10h9v11M12 3v7"/></svg>Plano</button>
